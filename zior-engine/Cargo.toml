[package]
name    = "zior-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zior-engine"
path = "src/main.rs"

[lib]
name = "zior_engine"
path = "src/lib.rs"

[dependencies]
# Web
axum               = { version = "0.7", features = ["json", "multipart", "tracing"] }
tokio              = { version = "1",   features = ["full"] }
tower-http         = { version = "0.6", features = ["trace", "cors"] }

# Serialisation
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
chrono             = { version = "0.4", features = ["serde"] }

# Math / DSP
realfft            = "3"      # real-valued FFT (more efficient for audio)

# Audio decoding
symphonia          = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "aac"] }

# Config & infra
config             = "0.14"
uuid               = { version = "1", features = ["v4", "serde"] }
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics            = "0.23"
metrics-exporter-prometheus = "0.15"
once_cell          = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto       = true
