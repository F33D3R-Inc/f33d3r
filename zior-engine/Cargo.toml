[package]
name    = "zior-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zior-engine"
path = "src/main.rs"

[lib]
name = "zior_engine"
path = "src/lib.rs"

[dependencies]
# Web
axum               = { version = "0.7", features = ["json", "multipart", "tracing"] }
tokio              = { version = "1",   features = ["full"] }
tower-http         = { version = "0.5", features = ["trace", "cors"] }

# Serialisation
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
chrono             = { version = "0.4", features = ["serde"] }

# Math / DSP
nalgebra           = "0.32"   # linear algebra, vector ops
rustfft            = "6"      # FFT for spectral analysis
realfft            = "3"      # real-valued FFT (more efficient for audio)

# Audio decoding
symphonia          = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "aac"] }

# Hashing / fingerprinting
sha2               = "0.10"
hex                = "0.4"

# Config & infra
config             = "0.14"
dashmap            = "5"      # concurrent in-memory store
uuid               = { version = "1", features = ["v4", "serde"] }
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand               = "0.8"

# HTTP client (to push signals to AethyrRank content store)
reqwest            = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto       = true
