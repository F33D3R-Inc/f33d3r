[package]
name    = "alexandria"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "alexandria"
path = "src/main.rs"

[dependencies]
manhattan-client = { path = "../libs/manhattan-client" }
# The sqlx-0.7 build of the shared drain; same code, same library name. See libs/manhattan-outbox/src/lib.rs.
manhattan-outbox = { package = "manhattan-outbox-sqlx07", path = "../libs/manhattan-outbox-sqlx07" }
axum                        = { version = "0.7", features = ["json"] }
tokio                       = { version = "1",   features = ["full"] }
serde                       = { version = "1",   features = ["derive"] }
serde_json                  = "1"
sqlx                        = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid                        = { version = "1",   features = ["v4", "serde"] }
chrono                      = { version = "0.4", features = ["serde"] }
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow                      = "1"
metrics                     = "0.23"
metrics-exporter-prometheus = "0.15"
once_cell                   = "1"
tower-http                  = { version = "0.6", features = ["trace"] }
reqwest                     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
