# F33D3R Rust Brain Deployments
# AethyrRank · Zior · Vovin · Ain Soph · Elohim Veni · Zodacare · Schema Registry
# All use identical deployment structure with brain-specific config.

---
# ── AethyrRank ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethyrrank
  namespace: f33d3r
  labels:
    brain: aethyrrank
spec:
  replicas: 3
  selector:
    matchLabels:
      brain: aethyrrank
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        brain: aethyrrank
    spec:
      containers:
        - name: aethyrrank
          image: registry.gitlab.com/f33d3r-core/platform/aethyrrank:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: f33d3r-secrets
                  key: feed-db-url
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: gitlab-registry-secret

---
apiVersion: v1
kind: Service
metadata:
  name: aethyrrank
  namespace: f33d3r
  labels:
    brain: aethyrrank
spec:
  selector:
    brain: aethyrrank
  ports:
    - port: 8080
      targetPort: 8080

