metadata:
  name: zodacare
  namespace: f33d3r
  labels:
    brain: zodacare
spec:
  replicas: 1
  selector:
    matchLabels:
      brain: zodacare
  template:
    metadata:
      labels:
        brain: zodacare
    spec:
      containers:
        - name: zodacare
          image: registry.gitlab.com/f33d3r-core/platform/zodacare:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: f33d3r-secrets
                  key: safety-db-url
