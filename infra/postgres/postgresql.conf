# F33D3R — Postgres 18 tuning for Hetzner CCX23 (4 vCPU, 16 GB RAM, NVMe SSD)
# Applied at container start via POSTGRES_EXTRA_OPTS or config mount.
# Revisit triggers: T0→T1 staircase, sustained CPU > 60%, RAM used > 80%.

# ── Network ───────────────────────────────────────────────────────────────────
listen_addresses        = '*'           # accept connections from all interfaces (required for Docker networking)

# ── Memory ────────────────────────────────────────────────────────────────────
shared_buffers          = 4GB          # 25% of RAM — page cache for hot data
effective_cache_size    = 12GB         # planner hint: how much OS+PG cache is available
work_mem                = 64MB         # per sort/hash op; 20 connections × 3 ops = 3.8 GB max
maintenance_work_mem    = 1GB          # VACUUM, CREATE INDEX, pg_dump load
huge_pages              = try          # enable if OS supports; no-op if not

# ── WAL & checkpoints ─────────────────────────────────────────────────────────
wal_buffers             = 64MB         # 1/32 of shared_buffers; saturates at 64 MB
checkpoint_completion_target = 0.9     # spread writes over 90% of checkpoint interval
checkpoint_timeout      = 15min        # longer windows → fewer WAL spikes
max_wal_size            = 4GB          # generous ceiling for write bursts (media uploads)
min_wal_size            = 512MB        # floor to avoid constant recycling
wal_compression         = on           # ~10-30% WAL size reduction on compressible payloads
wal_level               = replica      # minimum for pg_basebackup / streaming replica at T1

# ── NVMe SSD I/O ─────────────────────────────────────────────────────────────
random_page_cost        = 1.1          # SSD: random ≈ sequential; default 4.0 is for spinning disk
effective_io_concurrency = 200         # parallel I/O for bitmap heap scans; 200 for NVMe
maintenance_io_concurrency = 100

# ── Connections & pooling ──────────────────────────────────────────────────────
# PgBouncer sits in front; keep Postgres connections low to reduce overhead.
max_connections         = 100          # PgBouncer uses ~20 server conns; headroom for psql/admin
superuser_reserved_connections = 3

# ── Query planner ────────────────────────────────────────────────────────────
default_statistics_target = 200        # more histogram buckets → better cardinality estimates
enable_partitionwise_join  = on
enable_partitionwise_aggregate = on
jit                        = on        # JIT for complex analytical queries (AethyrRank scoring)

# ── Autovacuum ────────────────────────────────────────────────────────────────
# Aggressive autovacuum prevents table bloat on high-write tables (posts, follows).
autovacuum                       = on
autovacuum_max_workers           = 4
autovacuum_naptime               = 30s
autovacuum_vacuum_cost_delay     = 2ms   # default 2ms — reduce to 1ms if vacuum falls behind
autovacuum_vacuum_scale_factor   = 0.02  # vacuum when 2% of table is dead (default 20%)
autovacuum_analyze_scale_factor  = 0.01  # analyze when 1% is new (default 10%)
autovacuum_vacuum_insert_scale_factor = 0.02

# ── Observability ────────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max            = 10000
pg_stat_statements.track          = all
pg_stat_statements.track_utility  = on
track_io_timing                   = on   # enables I/O timing in pg_stat_statements
track_activity_query_size         = 4096

# ── Logging ───────────────────────────────────────────────────────────────────
log_min_duration_statement = 200       # log queries taking > 200ms (slow query log)
log_checkpoints            = on
log_connections            = off       # PgBouncer reconnects constantly; too noisy
log_disconnections         = off
log_lock_waits             = on
log_temp_files             = 10MB      # log when temp files exceed 10 MB (spill to disk)
log_autovacuum_min_duration = 1s       # log autovacuum runs that take > 1s
deadlock_timeout           = 1s
log_line_prefix            = '%m [%p] %q%u@%d '
