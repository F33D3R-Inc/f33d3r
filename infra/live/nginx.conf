# F33D3R live edge — HLS delivery.
#
# The ABR ladder is written to disk by the transcoder and served from here as
# static files. Delivery deliberately does not pass through the application
# server: a playlist request every second per viewer and a segment request every
# second per viewer is a file-serving workload, not an application workload, and
# putting it behind the session middleware is what breaks at 5,000 viewers.

worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    aio           threads;
    keepalive_timeout 65;

    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    # Only the CMAF segment type is missing from the stock mime.types;
    # redeclaring the others warns on every boot.
    types {
        video/iso.segment m4s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /srv;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Playlists change every segment: they must never be cached.
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
            expires -1;
            try_files $uri =404;
        }

        # Segments and init files are immutable once written.
        location ~ \.(m4s|mp4)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            try_files $uri =404;
        }

        # The poster is rewritten every sample interval.
        location ~ \.jpg$ {
            add_header Cache-Control "public, max-age=5" always;
            add_header Access-Control-Allow-Origin "*" always;
            try_files $uri =404;
        }

        # Nothing else is served. Directory listing off, no fallthrough.
        location / {
            return 404;
        }
    }
}
