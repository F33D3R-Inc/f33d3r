# F33D3R live edge — HLS delivery.
#
# The ABR ladder is written to disk by the transcoder and served from here as
# static files. Delivery deliberately does not pass through the application
# server: a playlist request every second per viewer and a segment request every
# second per viewer is a file-serving workload, not an application workload, and
# putting it behind the session middleware is what breaks at 5,000 viewers.
#
# Serving files is not the same as serving them to anyone. Every playlist,
# segment and poster is behind auth_request to the feed-engine live control
# plane, which applies the stream's audience (everyone, followers,
# subscribers), the adult wall and a moderation block to the viewer's own
# session cookie or bearer token. The answer is cached here for a few seconds
# per viewer per stream, so the application server is asked a few times a
# minute per viewer rather than twice a second, and the files themselves still
# never pass through it.

worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    aio           threads;
    keepalive_timeout 65;

    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    # Docker's embedded DNS. The control plane is resolved per request (see
    # the variable in proxy_pass below), so a recreated feed-engine container
    # with a new address is followed within the validity window, and the edge
    # starts whether or not feed-engine is up yet — it just refuses until it is.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # The stream a request names, from the path Caddy forwarded:
    # /live/<id>/<file> or /live/<id>/<rung>/<file>. $request_uri is read, not
    # $uri, because the auth subrequest's own $uri is /_live_auth.
    map $request_uri $live_stream {
        "~^/live/(?<sid>[A-Za-z0-9_-]{1,64})/" $sid;
        default                               "";
    }

    # Authorisation decisions, keyed by stream and by the credential the viewer
    # presented. A grant is held 10 s and a refusal 5 s: that bounds how long a
    # blocked stream or an ended subscription keeps playing, and how long a new
    # follower waits for the picture.
    proxy_cache_path /var/cache/nginx/live_auth levels=1:2 keys_zone=live_auth:10m
                     max_size=64m inactive=60s use_temp_path=off;

    # Only the CMAF segment type is missing from the stock mime.types;
    # redeclaring the others warns on every boot.
    types {
        video/iso.segment m4s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /srv;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The authorisation subrequest. internal: no viewer can request it.
        # The viewer's own headers (Cookie, Authorization) go with it; its body
        # does not. 2xx serves, 401/403 refuse with that status, and anything
        # else — the control plane down, a timeout — is an error and serves
        # nothing.
        location = /_live_auth {
            internal;
            set $live_control http://feed-engine:8110;
            proxy_pass $live_control/live/edge-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;

            proxy_cache live_auth;
            proxy_cache_key "$live_stream|$cookie_f33d3r_session|$http_authorization";
            proxy_cache_valid 204 10s;
            proxy_cache_valid 401 403 5s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        }

        # Every location below serves only what the control plane granted.
        # No Access-Control-Allow-Origin: the player is on the site's own
        # origin, and a wildcard would hand every other origin a gated stream
        # the viewer's cookie unlocked. Cache-Control is private for the same
        # reason — a shared cache in front of this would serve one viewer's
        # grant to the next.

        # Playlists change every segment: they must never be cached.
        location ~ \.m3u8$ {
            auth_request /_live_auth;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
            try_files $uri =404;
        }

        # Segments and init files are immutable once written.
        location ~ \.(m4s|mp4)$ {
            auth_request /_live_auth;
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The poster is rewritten every sample interval.
        location ~ \.jpg$ {
            auth_request /_live_auth;
            add_header Cache-Control "private, max-age=5" always;
            try_files $uri =404;
        }

        # Nothing else is served. Directory listing off, no fallthrough.
        location / {
            return 404;
        }
    }
}
