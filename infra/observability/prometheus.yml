# F33D3R — Prometheus scrape config
# Scrapes /metrics on every brain. Brains expose Prometheus-format metrics
# starting in S0.2 (structured-logging + metrics middleware sprint).
#
# Until S0.2 lands, only services that already expose /metrics will populate.
# Services without /metrics return 404, which Prometheus marks as "down" in
# /targets — that's expected and tracked.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: f33d3r-local
    region:  eu-falkenstein
    tier:    t0

rule_files:
  - /etc/prometheus/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ 'alertmanager:9093' ]

scrape_configs:

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]

  # ── F33D3R brains ──────────────────────────────────────────────────────────
  - job_name: nantar
    metrics_path: /metrics
    static_configs:
      - targets: [ 'feed-engine:8081' ]
        labels: { brain: nantar, lang: go }

  - job_name: aethyrrank
    metrics_path: /metrics
    static_configs:
      - targets: [ 'aethyrrank-engine:8080' ]
        labels: { brain: aethyrrank, lang: rust }

  - job_name: zior
    metrics_path: /metrics
    static_configs:
      - targets: [ 'zior-engine:8082' ]
        labels: { brain: zior, lang: rust }

  - job_name: caeor
    metrics_path: /metrics
    static_configs:
      - targets: [ 'caeor:8086' ]
        labels: { brain: caeor, lang: rust }

  - job_name: ain-soph
    metrics_path: /metrics
    static_configs:
      - targets: [ 'ain-soph:8089' ]
        labels: { brain: ain_soph, lang: rust }

  - job_name: aethyr-ledger
    metrics_path: /metrics
    static_configs:
      - targets: [ 'aethyr-ledger:8096' ]
        labels: { brain: aethyr_ledger, lang: rust }

  - job_name: verity
    metrics_path: /metrics
    static_configs:
      - targets: [ 'verity:8095' ]
        labels: { brain: verity, lang: rust }

  - job_name: elohim-veni
    metrics_path: /metrics
    static_configs:
      - targets: [ 'elohim-veni:8093' ]
        labels: { brain: elohim_veni, lang: rust }

  - job_name: zodacare
    metrics_path: /metrics
    static_configs:
      - targets: [ 'zodacare:8090' ]
        labels: { brain: zodacare, lang: rust }

  - job_name: schema-registry
    metrics_path: /metrics
    static_configs:
      - targets: [ 'aethyr-schema-registry:8079' ]
        labels: { brain: schema_registry, lang: rust }

  - job_name: registrar
    metrics_path: /metrics
    static_configs:
      - targets: [ 'registry-brain:8094' ]
        labels: { brain: registrar, lang: rust }

  - job_name: ekyc
    metrics_path: /metrics
    static_configs:
      - targets: [ 'ekyc:8099' ]
        labels: { brain: ekyc, lang: python }

  - job_name: auralis
    metrics_path: /metrics
    static_configs:
      - targets: [ 'auralis:8108' ]
        labels: { brain: auralis, lang: rust }

  # transcoder (8085) — uncomment when S0.5 ships
  # - job_name: transcoder
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: [ 'transcoder:8085' ]
  #       labels: { brain: transcoder, lang: rust }

  # ── Infrastructure ─────────────────────────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: [ 'node-exporter:9100' ]
        labels: { component: node }

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [ 'minio:9000' ]
        labels: { component: minio }

  # pgbouncer metrics require prometheus-pgbouncer-exporter — deferred to S0.3
  # - job_name: pgbouncer
  #   static_configs:
  #     - targets: [ 'pgbouncer-exporter:9127' ]
