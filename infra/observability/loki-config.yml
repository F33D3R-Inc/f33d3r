# F33D3R — Loki configuration
# Single-binary mode. Filesystem chunks. Tuned for T0 (one box, 14 brains).
# Migrate to S3-backed chunks at T2 (D-015 trigger).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h        # 7 days
  retention_period: 720h                   # 30 days at T0; tighten if disk pressure
  max_query_series: 5000
  max_query_parallelism: 16
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

# Brains push directly to Loki via HTTP at /loki/api/v1/push
# See docs/observability.md for the Go and Rust client snippets shipping in S0.2.
