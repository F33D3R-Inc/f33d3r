server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      # strip leading slash from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # extract brain name from f33d3r-local-<brain>-1 pattern
      - source_labels: ['__meta_docker_container_name']
        regex: '/f33d3r-local-(.+)-\d+'
        target_label: brain
        replacement: '$1'

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream

      - target_label: cluster
        replacement: f33d3r-local

    pipeline_stages:
      # Try to parse JSON logs (structured brains)
      - json:
          expressions:
            level:   level
            msg:     msg
            ts:      ts
            reqid:   request_id
      - labels:
          level:
      # Keep msg as the displayed log line when available
      - output:
          source: msg
