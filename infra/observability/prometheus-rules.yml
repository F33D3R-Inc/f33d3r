# F33D3R — Prometheus alerting rules
# Sprint 0 / S0.1 baseline. Four golden signals + capacity triggers from
# the T0 → T1 staircase decision (D-015).

groups:

  - name: brain_health
    interval: 30s
    rules:

      - alert: BrainDown
        expr: up{job=~"herald|nantar|aethyrrank|zior|caeor|ain-soph|aethyr-ledger|verity|elohim-veni|zodacare|schema-registry|registrar|ekyc|auralis"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Brain {{ $labels.brain }} is down"
          description: "Prometheus has not scraped {{ $labels.instance }} for 2 minutes."

      # Triggers a T0→T1 review. See D-015 in PROJECT_STATE.md.
      - alert: HostCpuSustainedHigh
        expr: avg(rate(process_cpu_seconds_total[5m])) by (instance) > 0.6
        for: 4h
        labels: { severity: warning, capacity_trigger: t0_to_t1 }
        annotations:
          summary: "Sustained CPU > 60% for 4h on {{ $labels.instance }}"
          description: "T0→T1 migration trigger fired. Review capacity plan."

      - alert: HighRequestErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (brain)
            / sum(rate(http_requests_total[5m])) by (brain)
            > 0.01
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.brain }} 5xx rate > 1%"
          description: "Brain {{ $labels.brain }} has elevated 5xx errors. Check logs in Loki."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (brain, le)) > 0.3
        for: 1h
        labels: { severity: warning, capacity_trigger: t0_to_t1 }
        annotations:
          summary: "{{ $labels.brain }} p95 > 300ms for 1h"
          description: "T0→T1 migration trigger fired. Review latency plan."

  - name: postgres_health
    interval: 30s
    rules:

      - alert: PgBouncerDown
        expr: up{component="pgbouncer"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PgBouncer is down"
          description: "All Postgres traffic via PgBouncer is failing."

      - alert: PostgresConnectionsHigh
        expr: pgbouncer_databases_pool_size > 60
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres pool size approaching limit"
          description: "PgBouncer reports pool size {{ $value }}. Limit is 70."

  - name: storage_health
    interval: 60s
    rules:

      - alert: MinioDown
        expr: up{component="minio"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "MinIO is down"
          description: "Media uploads + backups are failing."

      - alert: DiskUsageHigh
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk usage > 85% on {{ $labels.mountpoint }}"
          description: "Run cleanup or expand disk. CCX23 has 160 GB total."

  - name: notifications
    interval: 30s
    rules:

      - alert: NotificationOutboxStuck
        expr: notification_outbox_oldest_seconds > 60
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Notifications are not reaching Sitra Achra"
          description: "The oldest undelivered notification is {{ $value }} seconds old."

      - alert: WorkNotificationsStuck
        expr: notification_work_jobs_oldest_seconds > 120
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "New works are not telling the people they name"
          description: "The oldest overdue job is {{ $value }} seconds old. Check the naming plane and feed-engine logs."

      - alert: NotificationQuarantined
        expr: notification_outbox_blocked > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $value }} notifications are quarantined in the outbox"
          description: "SELECT id, blocked_reason FROM notification_outbox WHERE blocked_at IS NOT NULL."

      - alert: NotificationDeadEvents
        expr: increase(herald_notifications_dead_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Herald sent notification events to the dead topic"
          description: "Read notification.events.dead for the reason."

      - alert: NotificationsNotStored
        expr: notification_reconcile_missing > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Delivered notifications are not in Herald"
          description: "{{ $value }} were missing at the last reconciliation."

      - alert: NotificationsLost
        expr: increase(notification_reconcile_lost_total[1h]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Notifications were lost"
          description: "Herald never stored them after every republish. The event IDs are in the feed-engine log."

      - alert: NotificationStoreSlow
        expr: max(herald_notification_store_delay_seconds{quantile="0.99"}) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Notifications are taking over 10 seconds to reach the inbox"
          description: "Check the notification.events consumer lag."

      - alert: NotificationBadgeSlow
        expr: histogram_quantile(0.99, sum(rate(notification_store_to_badge_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The live badge is missing its 2 second target"
          description: "99th percentile from stored to badge is {{ $value }} seconds."

      - alert: PushFailing
        expr: increase(herald_push_attempts_total{outcome="failed"}[10m]) > 10
        labels: { severity: warning }
        annotations:
          summary: "Push delivery is failing"
          description: "Check VAPID keys and push service reachability."

      - alert: LiveEventsDropped
        expr: rate(sse_dropped_total[5m]) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Live events are being dropped on full connection buffers"
          description: "Clients re-read after a drop, but this means connections are falling behind."
