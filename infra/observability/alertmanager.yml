# F33D3R — Alertmanager routing
# Critical → Discord webhook + email (immediate). Warning → Discord only.
# Capacity triggers from D-015 → tagged routing for capacity-planning channel.

global:
  resolve_timeout: 5m
  smtp_smarthost:    "localhost:25"
  smtp_from:         "alerts@mail.f33d3r.com"
  smtp_require_tls:  false

route:
  group_by:           ['alertname', 'brain']
  group_wait:         30s
  group_interval:     5m
  repeat_interval:    4h
  receiver:           discord_warning
  routes:
    - matchers:
        - severity = "critical"
      receiver: discord_critical
      continue: true

    - matchers:
        - severity = "critical"
      receiver: email_oncall

    - matchers:
        - capacity_trigger = "t0_to_t1"
      receiver: discord_capacity
      group_wait: 1m
      repeat_interval: 24h

receivers:

  - name: discord_warning
    webhook_configs:
      - url: "http://localhost/disabled"
        send_resolved: true

  - name: discord_critical
    webhook_configs:
      - url: "http://localhost/disabled"
        send_resolved: true

  - name: discord_capacity
    webhook_configs:
      - url: "http://localhost/disabled"
        send_resolved: false

  - name: email_oncall
    email_configs:
      - to: "oncall@f33d3r.com"
        send_resolved: true
        headers:
          Subject: "[F33D3R CRITICAL] {{ .CommonAnnotations.summary }}"

inhibit_rules:
  # When a brain is down, don't fire latency/error alerts for the same brain.
  - source_matchers: [ alertname = "BrainDown" ]
    target_matchers: [ alertname =~ "HighRequestErrorRate|HighLatencyP95" ]
    equal: [ brain ]
