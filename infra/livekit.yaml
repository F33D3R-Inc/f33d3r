# LiveKit for Frequencies. The node's address and its keys come from compose.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
# Egress finds LiveKit through Redis.
redis:
  address: redis-state:6379
room:
  # Auralis opens every room. A client holding a token cannot create one.
  auto_create: false
logging:
  level: info
  json: true
