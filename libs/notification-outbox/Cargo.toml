[package]
name = "notification-outbox"
version = "1.0.0"
edition = "2021"
description = "Durable notification delivery from a Rust brain to Herald through Sitra Achra"
publish = false

[lib]
name = "notification_outbox"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
metrics = "0.23"
