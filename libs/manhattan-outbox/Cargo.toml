[package]
name = "manhattan-outbox"
version = "1.0.0"
edition = "2021"
description = "The Manhattan outbox drain, shared by every Rust brain that publishes to the naming plane (sqlx 0.8)"
publish = false

[lib]
name = "manhattan_outbox"
path = "src/lib.rs"

[dependencies]
manhattan-client = { path = "../manhattan-client" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tracing = "0.1"
serde_json = "1"
anyhow = "1"
