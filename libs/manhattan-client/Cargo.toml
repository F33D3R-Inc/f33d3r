[package]
name = "manhattan-client"
version = "1.0.0"
edition = "2021"
description = "F33D3R Manhattan naming-plane client, shared by every Rust brain"
publish = false

[lib]
name = "manhattan_client"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
