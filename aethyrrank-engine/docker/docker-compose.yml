version: "3.9"

# Add this service block to F33D3R's existing docker-compose.yml.
# All other F33D3R services (api-gateway, user-service, content-service,
# feed-service) remain unchanged.

services:
  aethyrrank-engine:
    build:
      context: ./aethyrrank-engine
      dockerfile: docker/Dockerfile
    image: aethyrrank-engine:latest
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: "info"
      APP__SERVER__HOST: "0.0.0.0"
      APP__SERVER__PORT: "8080"
      # Override any config key with APP__SECTION__KEY=value
      # e.g. APP__BANDIT__BETA_DEFAULT=0.3
    restart: unless-stopped
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - f33d3r-internal

networks:
  f33d3r-internal:
    external: true   # attach to F33D3R's existing network
