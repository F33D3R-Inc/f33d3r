[server]
host = "0.0.0.0"
port = 8080

# ── Stage weights ──────────────────────────────────────────────────────────────
# Each layer contributes additively to final_score.
# Caps enforce that no single layer dominates.
[pipeline]
# Max fraction of final score that revenue layer can contribute
revenue_weight_cap  = 0.30
# Max fraction from exploration bonus
explore_weight_cap  = 0.10
# Neural model base weight
neural_base_weight  = 1.0
# AESQ acts as constraint multiplier (0=full block, 1=pass through)
aesq_constraint_weight = 0.40

# ── Pre-ranker ─────────────────────────────────────────────────────────────────
[prerank]
# Pass this many candidates into the expensive neural stage
top_k = 100
# Fast score = quality * freshness; items below this are dropped
min_fast_score = 0.05

# ── AESQ constraint layer ──────────────────────────────────────────────────────
[scoring.weights]
w_alignment = 0.30
w_expansion = 0.20
w_shadow    = 0.15   # hard cap enforced in code
w_quality   = 0.25
w_freshness = 0.10

[scoring.freshness]
half_life_hours = 24.0

[scoring.quality]
w_like             = 1.0
w_share            = 3.0
w_comment          = 2.0
w_save             = 4.0
w_view_time        = 0.5

# ── Velocity layer ─────────────────────────────────────────────────────────────
[velocity]
# Multiplier applied to high-velocity content's base score
boost_multiplier   = 0.20
# Velocity score above this threshold triggers promotion
promotion_threshold = 0.70
# Velocity score below this triggers decay
decay_threshold    = 0.20

# ── Revenue layer ──────────────────────────────────────────────────────────────
[revenue]
# Weight on conversion_probability signal
w_conversion   = 0.50
# Weight on creator_revenue_rate signal
w_creator_rate = 0.30
# Weight on lifetime_value_estimate
w_ltv          = 0.20
# Hard cap — revenue cannot exceed this fraction of base score adjustment
max_adjustment = 0.30

# ── Safety barrier ─────────────────────────────────────────────────────────────
[safety]
# Default epsilon for unclassified users (permissive)
default_epsilon     = 0.10
# SFW / "safe mode" users — near-zero adult content probability allowed
sfw_epsilon         = 0.000001
# Score applied when item exceeds epsilon (effectively -∞)
hard_block_score    = -999999.0

# ── Exploration / bandit ───────────────────────────────────────────────────────
[bandit]
# LinUCB kept ONLY for exploration controller
alpha_ucb          = 1.0
feature_dim        = 7
exploration_count  = 2
# Cold start: inject more exploration
cold_start_explore_count = 4

[model_store]
surfaces = ["feed", "explore", "search", "notifications"]

# ── In-network boost ───────────────────────────────────────────────────────────
# Score bonus applied to content from creators the requesting user follows.
# Mirrors X's in-network content pool priority without hard pool separation.
[network]
network_boost = 0.08
