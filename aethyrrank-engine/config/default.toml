[server]
host = "0.0.0.0"
port = 8080

# ── Stage weights ──────────────────────────────────────────────────────────────
# Each layer contributes additively to final_score.
# Caps enforce that no single layer dominates.
[pipeline]
# Max fraction of final score that revenue layer can contribute
revenue_weight_cap  = 0.30
# Max fraction from exploration bonus
explore_weight_cap  = 0.10
# Neural model base weight
neural_base_weight  = 1.0
# AESQ acts as constraint multiplier (0=full block, 1=pass through)
aesq_constraint_weight = 0.40

# ── Pre-ranker ─────────────────────────────────────────────────────────────────
[prerank]
# Pass this many candidates into the expensive neural stage
top_k = 100
# Fast score = quality * freshness; items below this are dropped
min_fast_score = 0.05

# ── AESQ constraint layer ──────────────────────────────────────────────────────
[scoring.weights]
w_alignment = 0.30
w_expansion = 0.20
w_shadow    = 0.15   # hard cap enforced in code
w_quality   = 0.25
w_freshness = 0.10

[scoring.freshness]
half_life_hours = 24.0

[scoring.quality]
w_like             = 1.0
w_share            = 3.0
w_comment          = 2.0
w_save             = 4.0
w_view_time        = 0.5

# ── Velocity layer ─────────────────────────────────────────────────────────────
[velocity]
# Multiplier applied to high-velocity content's base score
boost_multiplier   = 0.20
# Velocity score above this threshold triggers promotion
promotion_threshold = 0.70
# Velocity score below this triggers decay
decay_threshold    = 0.20

# ── Revenue layer ──────────────────────────────────────────────────────────────
[revenue]
# Weight on conversion_probability signal
w_conversion   = 0.50
# Weight on creator_revenue_rate signal
w_creator_rate = 0.30
# Weight on lifetime_value_estimate
w_ltv          = 0.20
# Hard cap — revenue cannot exceed this fraction of base score adjustment
max_adjustment = 0.30

# ── Exploration / bandit ───────────────────────────────────────────────────────
[bandit]
feature_dim        = 7
exploration_count  = 2
# Cold start: inject more exploration
cold_start_explore_count = 4

# ── Learned preference (LinUCB) ────────────────────────────────────────────────
# Each viewer has one LinUCB model per surface, trained by ranking.events
# (src/learning/). On /rank its expected reward θᵀx for the work's feature
# vector, clamped to [0, 1], is added to the score as
#
#     learned_adj = learned_weight × θᵀx
#
# 0.15 because:
#   * it is below the revenue cap (0.30): a person's own history should move
#     their feed more than an in-network follow (0.08) but never outweigh the
#     engagement model and the AESQ constraint, which see the whole pool;
#   * θᵀx starts at 0 (b = 0) and grows only as rewards accumulate, so a new
#     viewer is ranked exactly as before, and a heavy one can lift a work by at
#     most 0.15 — enough to reorder works the base score rates as near-equal,
#     not enough to bury a clearly better one;
#   * only the expected reward is used, not the UCB bonus: exploration is the
#     explorer's job (exploration slots), and adding it here would explore twice.
[learning]
learned_weight = 0.15

# ── In-network boost ───────────────────────────────────────────────────────────
# Score bonus applied to content from creators the requesting user follows.
# Mirrors X's in-network content pool priority without hard pool separation.
[network]
network_boost = 0.08
