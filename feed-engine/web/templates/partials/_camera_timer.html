{{/*
FACET camera_timer (atomic)
  version: 1.0 | status: stable | layer: atomic
  Recording duration readout. Shown only while recording (substrate toggles
  display). The substrate writes elapsed time into the timer-text facet.
  inputs:  none — JS-driven
*/}}
{{define "camera_timer"}}
<div class="capture-timer" data-facet-id="facet:f33d3r:capture:timer" style="display:none"
     aria-live="polite" aria-label="Recording duration">
  <span class="capture-rec-dot" aria-hidden="true"></span>
  <span data-facet-id="facet:f33d3r:capture:timer-text">0:00</span>
</div>
{{end}}
