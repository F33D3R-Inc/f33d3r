{{/*
FACET theme_toggle
  version: 1.0 | status: stable | layer: 1

  inputs: none

  states:
    light (default) | dark

  children: none

  signals:
    emits:    toggleDarkMode (JS only — no server event)
    receives: none

  context:
    nav_shell → nav footer
*/}}
{{define "theme_toggle"}}
<button class="theme-mode-toggle" id="mode-toggle-btn" type="button" title="Toggle dark/light mode"
        onclick="window.toggleDarkMode && window.toggleDarkMode()">
  <svg id="mode-icon-sun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
       style="width:16px;height:16px;display:none">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg id="mode-icon-moon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
       style="width:16px;height:16px">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>
{{end}}
