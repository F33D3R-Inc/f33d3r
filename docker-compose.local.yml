# F33D3R Local Docker Compose
# Run from the directory containing all 5 unzipped service folders.
# Usage: docker compose -f docker-compose.local.yml --env-file .env.local up --build
# Only the 4 BUILT services are active. 9 stub brains commented out.

services:

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-f33d3r}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-f33d3rdev}"
      POSTGRES_DB: "${POSTGRES_DB:-f33d3r}"
      PGDATA: "/var/lib/postgresql/data/18/docker"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f33d3r}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  aethyr-schema-registry:
    build:
      context: ./aethyr-schema-registry
      dockerfile: docker/Dockerfile
    ports:
      - "8079:8079"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_registry?sslmode=disable"
      PORT: "8079"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8079/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  aethyrrank-engine:
    build:
      context: ./aethyrrank-engine
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      APP__SERVER__PORT: "8080"
      APP__SERVER__HOST: "0.0.0.0"
      SCHEMA_REGISTRY_URL: "http://aethyr-schema-registry:8079"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_feed?sslmode=disable"
    depends_on:
      aethyr-schema-registry:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  zior-engine:
    build:
      context: ./zior-engine
      dockerfile: docker/Dockerfile
    ports:
      - "8082:8082"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      ZIOR__SERVER__PORT: "8082"
      ZIOR__AETHYR__CONTENT_STORE_URL: "http://aethyrrank-engine:8080"
      SCHEMA_REGISTRY_URL: "http://aethyr-schema-registry:8079"
    depends_on:
      aethyrrank-engine:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 25s

  feed-engine:
    build:
      context: ./feed-engine
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_feed?sslmode=disable"
      AETHYRRANK_URL: "http://aethyrrank-engine:8080"
      ZIOR_URL: "http://zior-engine:8082"
      AIN_SOPH_URL: "http://ain-soph:8089"
      VOVIN_URL: "http://aethyr-msg:8092"
      ZODACARE_URL: "http://zodacare:8090"
      ELOHIM_VENI_URL: "http://elohim-veni:8093"
      VERITY_URL: "http://verity:8095"
      EKYC_URL: "http://ekyc:8099"
      LEDGER_URL: "http://aethyr-ledger:8096"
      CAEOR_URL: "http://caeor:8086"
      MINIO_ENDPOINT: "http://minio:9000"
      THESSALON_URL: "http://thessalon:8084"
      REDIS_URL: "redis://redis:6379"
      SESSION_SECRET: "${SESSION_SECRET:-dev_secret_change_in_production_32chars}"
      SHOW_SCORES: "${SHOW_SCORES:-false}"
      DEV_MODE: "${DEV_MODE:-false}"
    volumes:
      - ./feed-engine/web/static:/app/web/static    # live CSS/JS/brand — git pull = instant update
      - ./feed-engine/web/templates:/app/web/templates:ro  # live templates — restart to pick up
      - f33d3r_media:/app/web/static/media          # user media — named volume overlays bind mount
    depends_on:
      postgres:
        condition: service_healthy
      aethyrrank-engine:
        condition: service_healthy
      caeor:
        condition: service_healthy
      thessalon:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/api/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  ain-soph:
    build:
      context: ./ain-soph
      dockerfile: docker/Dockerfile
    ports:
      - "8089:8089"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8089"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_wallet?sslmode=disable"
      AETHYRRANK_URL: "http://aethyrrank-engine:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8089/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  aethyr-msg:
    build:
      context: ./aethyr-msg
      dockerfile: docker/Dockerfile
    ports:
      - "8092:8092"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8092"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_msg?sslmode=disable"
      REGISTRY_URL: "http://aethyr-schema-registry:8079"
      AETHYRRANK_URL: "http://aethyrrank-engine:8080"
    depends_on:
      postgres:
        condition: service_healthy
      aethyr-schema-registry:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8092/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  elohim-veni:
    build:
      context: ./elohim-veni
      dockerfile: docker/Dockerfile
    ports:
      - "8093:8093"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8093"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_security?sslmode=disable"
      VERITY_URL: "http://verity:8095"
    depends_on:
      postgres:
        condition: service_healthy
      verity:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8093/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  zodacare:
    build:
      context: ./zodacare
      dockerfile: docker/Dockerfile
    ports:
      - "8090:8090"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8090"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_safety?sslmode=disable"
      ELOHIM_VENI_URL: "http://elohim-veni:8093"
    depends_on:
      postgres:
        condition: service_healthy
      elohim-veni:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  registry-brain:
    build:
      context: ./registry-brain
      dockerfile: docker/Dockerfile
    ports:
      - "8094:8094"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8094"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_handles?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8094/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  verity:
    build:
      context: ./verity
      dockerfile: docker/Dockerfile
    ports:
      - "8095:8095"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8095"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_verity?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8095/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  aethyr-ledger:
    build:
      context: ./aethyr-ledger
      dockerfile: docker/Dockerfile
    ports:
      - "8096:8096"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8096"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_ledger?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8096/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # HTTPS reverse proxy — required for WebCrypto on Safari/Firefox from non-localhost origins
  # Serves f33d3r on https://localhost:8443 with a self-signed cert (trusted locally via mkcert or browser exception)
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
      - "8444:8080"
    volumes:
      - ./infra/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      feed-engine:
        condition: service_healthy

  caeor:
    build:
      context: ./caeor
      dockerfile: docker/Dockerfile
    ports:
      - "8086:8086"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8086"
      MEDIA_DIR: "/data/media"
      DEV_MODE: "${DEV_MODE:-false}"
      # MinIO / S3-compatible storage (Sprint 0 / S0.5)
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_PUBLIC_BASE: "/media"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-f33d3r_minio}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-f33d3rdev_change_in_prod_32c}"
      MINIO_REGION: "us-east-1"
      MINIO_BUCKET_RAW: "media-raw"
      MINIO_BUCKET_DERIVED: "media-derived"
    volumes:
      - f33d3r_media:/data/media
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  thessalon:
    build:
      context: ./thessalon
      dockerfile: docker/Dockerfile
    ports:
      - "8084:8084"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      PORT: "8084"
      DATABASE_URL: "postgres://${POSTGRES_USER:-f33d3r}:${POSTGRES_PASSWORD:-f33d3rdev}@postgres:5432/f33d3r_commerce?sslmode=disable"
      AIN_SOPH_URL: "http://ain-soph:8089"
      VERITY_URL: "http://verity:8095"
    depends_on:
      postgres:
        condition: service_healthy
      ain-soph:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ── eKYC brain — face match, OCR, anti-spoof (Python, port 8099) ──────────
  ekyc:
    build:
      context: ./ekyc
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # STUB BRAINS — not yet built:
  # nantar-engine (8083), loxion (8087), astraon (8088)

  # ═══════════════════════════════════════════════════════════════════════════
  # SPRINT 0 — FOUNDATION LAYER
  # Observability + storage + connection pooling. All new services below this
  # line were added by Sprint 0 / S0.1. They do not modify any existing brain.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── PgBouncer — Postgres transaction pooling ─────────────────────────────
  # Brains will switch their DATABASE_URL host from "postgres" to "pgbouncer"
  # in S0.3. Until then this runs alongside and is unused.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: "${POSTGRES_USER:-f33d3r}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-f33d3rdev}"
      DB_HOST: "postgres"
      DB_NAME: "*"
      POOL_MODE: "transaction"
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      ADMIN_USERS: "${POSTGRES_USER:-f33d3r}"
      AUTH_TYPE: "scram-sha-256"
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-f33d3r}" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── MinIO — S3-compatible object storage ─────────────────────────────────
  # Buckets created by minio-init on first boot:
  #   media-raw       — original uploads
  #   media-derived   — transcoded variants (HLS segments, WebP renditions)
  #   backups         — pg_dump nightly backups
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-f33d3r_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-f33d3rdev_change_in_prod_32c}"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/media-raw     || true
        mc mb -p local/media-derived || true
        mc mb -p local/backups       || true
        # Public read on media-derived only (CDN will front this in T2+)
        mc anonymous set download local/media-derived || true
        echo "[minio-init] buckets ready"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-f33d3r_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-f33d3rdev_change_in_prod_32c}"
    restart: "no"

  # ── Transcoder brain (NEW) — Rust + ffmpeg, port 8085 ────────────────────
  # Scaffolded in S0.1, implementation lands in S0.5. Until S0.5 ships, this
  # service is commented out — uncomment after `transcoder/` directory exists.
  #
  # transcoder:
  #   build:
  #     context: ./transcoder
  #     dockerfile: docker/Dockerfile
  #   ports:
  #     - "8085:8085"
  #   environment:
  #     RUST_LOG: "${RUST_LOG:-info}"
  #     PORT: "8085"
  #     KAFKA_BROKERS: "kafka:9092"
  #     MINIO_ENDPOINT: "http://minio:9000"
  #     MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-f33d3r_minio}"
  #     MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-f33d3rdev_change_in_prod_32c}"
  #     MINIO_BUCKET_RAW: "media-raw"
  #     MINIO_BUCKET_DERIVED: "media-derived"
  #     FFMPEG_THREADS: "2"
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   healthcheck:
  #     test: [ "CMD", "curl", "-f", "http://localhost:8085/health" ]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 30s

  # ── Prometheus — metrics scraping ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/healthy" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Loki — structured log aggregation ────────────────────────────────────
  loki:
    build:
      context: ./infra/observability
      dockerfile: loki.Dockerfile
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Alertmanager — alert routing ─────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9093/-/healthy" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Grafana — dashboards ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-f33d3rdev_change_in_prod}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  f33d3r_media:
  minio_data:
  prometheus_data:
  loki_data:
  alertmanager_data:
  grafana_data:
