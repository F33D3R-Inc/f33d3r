# F33D3R Circuit Breaker Rules
# Applied per-service via Nginx upstream config and Envoy cluster policies.
# Prevents cascade failure when a brain goes down.

version: "1.0"

# Global defaults — overridden per-service below
defaults:
  max_connections: 100
  max_pending_requests: 50
  max_requests: 100
  max_retries: 3
  consecutive_5xx_threshold: 5
  interval_seconds: 10
  base_ejection_time_seconds: 30
  max_ejection_percent: 50

services:

  aethyrrank:
    # If AethyrRank is down, Nantar falls back to engagement×freshness ranker.
    # Low timeout is intentional — never block feed assembly.
    timeout_ms: 200
    fallback: local_ranker
    max_connections: 200
    consecutive_5xx_threshold: 3
    base_ejection_time_seconds: 10
    retry:
      attempts: 1
      conditions: [ connect-failure, reset ]

  zior:
    # Track listing is non-critical. Fail open with cached data.
    timeout_ms: 500
    fallback: empty_track_list
    max_connections: 50
    consecutive_5xx_threshold: 5
    retry:
      attempts: 2
      conditions: [ connect-failure, reset, 5xx ]

  vovin:
    # Messaging relay — WebSocket timeout is separate from HTTP.
    timeout_ms: 1000
    websocket_timeout_seconds: 300
    fallback: queue_and_retry
    max_connections: 500
    consecutive_5xx_threshold: 10
    retry:
      attempts: 3
      conditions: [ connect-failure, reset ]

  ain-soph:
    # Wallet is non-blocking for UI — show cached balance or "unavailable".
    timeout_ms: 3000
    fallback: show_unavailable
    max_connections: 50
    consecutive_5xx_threshold: 5
    retry:
      attempts: 2
      conditions: [ connect-failure, reset ]

  elohim-veni:
    # Capability checks are fast — if Elohim Veni is down, deny by default (fail-closed).
    timeout_ms: 100
    fallback: deny_action
    max_connections: 200
    consecutive_5xx_threshold: 3
    base_ejection_time_seconds: 5
    retry:
      attempts: 1
      conditions: [ connect-failure ]

  zodacare:
    # Content reports are async — queue locally and retry.
    timeout_ms: 2000
    fallback: queue_report_locally
    max_connections: 50
    consecutive_5xx_threshold: 10
    retry:
      attempts: 3
      conditions: [ connect-failure, reset, 5xx ]

  schema-registry:
    # Schema lookups are cached — registry going down doesn't break serving.
    timeout_ms: 500
    fallback: use_cached_schema
    max_connections: 20
    consecutive_5xx_threshold: 10

# Fail-closed policy for capability checks
# When Elohim Veni is unreachable:
#   - POSTING: DENY
#   - MESSAGING: DENY
#   - MUSIC_UPLOAD: DENY
#   - READ operations: ALLOW (read-only, safe to allow without check)
capability_fail_policy:
  elohim_veni_unreachable: deny_write_allow_read
  grace_period_seconds: 0    # no grace — immediate deny on unreachable
