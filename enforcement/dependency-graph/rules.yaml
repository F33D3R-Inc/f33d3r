# F33D3R Brain Dependency Rules
# Enforced at CI time by graph_validation.py
# Violations block merge to main.
#
# Format:
#   brain: source brain name
#   can_call: list of brains this brain may call directly via HTTP
#   kafka_produce: Kafka topics this brain may produce to
#   kafka_consume: Kafka topics this brain may consume from
#   forbidden_call: explicit deny list (belt + suspenders)

version: "1.0"

brains:

  nantar:
    description: "Feed, UI, social layer — user-facing entry point"
    service_dir: feed-engine
    port: 8081
    can_call:
      - aethyrrank          # POST /rank, POST /feedback
      - zior                # GET /v1/tracks, GET /v1/artist/:id/tracks
      - ain-soph            # GET /balance/:user_id
      - vovin               # proxy — all /vovin/* requests
      - elohim-veni         # POST /v1/pial/bootstrap (signup only)
      - zodacare            # POST /v1/reports (async, fire-and-forget)
      - schema-registry     # schema lookups
      - caeor               # POST /v1/media/upload (image resize, WebP conversion)
      - thessalon           # subscriptions, PPV, tips, earnings
    kafka_produce:
      - content.events
      - identity.events
    kafka_consume:
      - safety.events
      - ranking.events
      - economy.events
    forbidden_call:
      - nantar              # cannot call itself via HTTP

  aethyrrank:
    description: "Ranking engine — observational only"
    service_dir: aethyrrank-engine
    port: 8080
    can_call:
      - schema-registry
    kafka_produce:
      - ranking.events
    kafka_consume:
      - content.events
      - safety.events
    forbidden_call:
      - nantar
      - zior
      - vovin
      - ain-soph
      - elohim-veni
      - zodacare

  zior:
    description: "Music cortex — audio signals only"
    service_dir: zior-engine
    port: 8082
    can_call:
      - schema-registry
    kafka_produce:
      - ranking.events
    kafka_consume:
      - content.events
    forbidden_call:
      - nantar
      - aethyrrank
      - vovin
      - ain-soph
      - elohim-veni
      - zodacare

  vovin:
    description: "Messaging relay — never sees plaintext"
    service_dir: aethyr-msg
    port: 8092
    can_call:
      - schema-registry
    kafka_produce:
      - messaging.events
    kafka_consume: [ ]
    forbidden_call:
      - nantar
      - aethyrrank
      - zior
      - ain-soph
      - elohim-veni
      - zodacare

  ain-soph:
    description: "Wallet — double-entry ledger"
    service_dir: ain-soph
    port: 8089
    can_call:
      - schema-registry
    kafka_produce:
      - economy.events
    kafka_consume:
      - identity.events
    forbidden_call:
      - nantar
      - aethyrrank
      - zior
      - vovin
      - elohim-veni
      - zodacare

  elohim-veni:
    description: "PIAL enforcement — deterministic, no psychology"
    service_dir: elohim-veni
    port: 8093
    can_call:
      - schema-registry
    kafka_produce:
      - safety.events
    kafka_consume:
      - safety.events
      - identity.events
    forbidden_call:
      - nantar
      - aethyrrank
      - zior
      - vovin
      - ain-soph
      - zodacare

  zodacare:
    description: "Safety — risk scoring and moderation actions"
    service_dir: zodacare
    port: 8090
    can_call:
      - elohim-veni         # POST /v1/pial/:id/action (moderation actions only)
      - schema-registry
    kafka_produce:
      - safety.events
    kafka_consume:
      - content.events
      - identity.events
    forbidden_call:
      - nantar
      - aethyrrank
      - zior
      - vovin
      - ain-soph

  thessalon:
    description: "Commerce brain — subscriptions, PPV, tips, payouts"
    service_dir: thessalon
    port: 8084
    can_call:
      - ain-soph            # POST /v1/transfer, POST /v1/tip (AET movements)
      - verity              # GET /v1/kyc/:pial_id (monetization eligibility)
    kafka_produce:
      - economy.events
    kafka_consume: [ ]
    forbidden_call:
      - nantar
      - aethyrrank
      - zior
      - vovin
      - elohim-veni
      - zodacare

  caeor:
    description: "Media brain — image resize, format conversion, derivative generation"
    service_dir: caeor
    port: 8086
    can_call: [ ]
    kafka_produce: [ ]
    kafka_consume: [ ]
    forbidden_call:
      - nantar
      - aethyrrank
      - zior
      - vovin
      - ain-soph
      - elohim-veni
      - zodacare

  schema-registry:
    description: "Schema versioning — supporting service"
    service_dir: aethyr-schema-registry
    port: 8079
    can_call: [ ]
    kafka_produce: [ ]
    kafka_consume: [ ]
    forbidden_call:
      - nantar
      - aethyrrank
      - zior
      - vovin
      - ain-soph
      - elohim-veni
      - zodacare

# ── Global rules ──────────────────────────────────────────────────────────────

global_rules:
  # No brain may read another brain's database directly
  - rule: no_cross_db_access
    description: "Each brain owns exactly one database. No direct cross-DB queries."
    enforcement: ci_and_runtime

  # Psychology data must never flow to enforcement brains
  - rule: no_psychology_in_enforcement
    description: "AESQ scores, Jung axes, and archetype labels must not appear in Elohim Veni or Zodacare."
    enforcement: code_review

  # PIAL UUIDs created only by Nantar
  - rule: pial_uuid_source
    description: "Only Nantar's pial.go may generate new PIAL root UUIDs."
    enforcement: ci_and_runtime

  # Safety barrier is a hard remove, not a soft weight
  - rule: safety_hard_constraint
    description: "Items that fail the safety barrier must be removed from response, not penalised."
    enforcement: code_review
