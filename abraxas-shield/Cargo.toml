[package]
name = "abraxas-shield"
version = "4.0.0"
edition = "2021"
description = "Abraxas — the integrity authority: banned-content gate, PIAL-keyed fingerprints and ownership, verdicts, review, reports"

[[bin]]
name = "abraxas-shield"
path = "src/main.rs"

[dependencies]
manhattan-client = { path = "../libs/manhattan-client" }
manhattan-outbox = { path = "../libs/manhattan-outbox" }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rdkafka = { version = "0.39", features = ["cmake-build"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
