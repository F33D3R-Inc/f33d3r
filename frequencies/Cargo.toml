[package]
name = "auralis"
version = "1.0.0"
edition = "2021"
description = "Auralis — F33D3R Frequencies, the live-audio social object brain"

[[bin]]
name = "auralis"
path = "src/main.rs"

[dependencies]
manhattan-client = { path = "../libs/manhattan-client" }
manhattan-outbox = { path = "../libs/manhattan-outbox" }
axum = { version = "0.7", features = ["json", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1"
thiserror = "1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
# Hot transient state — presence TTLs, speaker/listener sets, request queue,
# media-node leases, rate-limit counters. The first Rust brain on Redis; the
# service has run in both compose files for every other brain to ignore.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# Sitra Achra. Same client abraxas-shield consumes with; here it only produces,
# draining the frequency_events outbox table.
rdkafka = { version = "0.39", features = ["cmake-build"] }
str0m = { version = "0.23", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
