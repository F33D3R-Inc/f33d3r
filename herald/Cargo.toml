[package]
name = "herald"
version = "0.1.0"
edition = "2021"
description = "Herald — Push Notification Brain for F33D3R"

[[bin]]
name = "herald"
path = "src/main.rs"

[dependencies]
manhattan-client = { path = "../libs/manhattan-client" }
manhattan-outbox = { path = "../libs/manhattan-outbox" }
# Web framework
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Identifiers + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Push delivery
web-push = "0.10"
base64 = "0.22"

# Naming plane (Manhattan) — HTTP client for src/manhattan_client.rs
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Error handling
anyhow = "1"

# Observability metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
