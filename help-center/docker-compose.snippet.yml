# Paste this service block into your docker-compose.prod.yml (or docker-compose.local.yml for testing).
# Caddy/nginx handles TLS and routes help.f33d3r.com → help-center:8080 internally.

services:
  help-center:
    image: f33d3r-help-center:latest
    build: ./help-center
    restart: unless-stopped
    volumes:
      - ./help-center/docs:/app/docs   # drop .docx files here; no rebuild needed
    networks:
      - f33d3r-net   # same network as existing services
    # No ports exposed — sits behind the existing Caddy/nginx reverse proxy

networks:
  f33d3r-net:
    external: true   # already declared in your main compose file
