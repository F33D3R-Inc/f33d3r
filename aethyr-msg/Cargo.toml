[package]
name    = "aethyr-msg"
version = "1.0.0"
edition = "2021"
description = "AethyrMsg Protocol (AMP v1) — E2E encrypted messaging brain for F33D3R"

[[bin]]
name = "aethyr-msg"
path = "src/main.rs"

[dependencies]
# Web framework
axum               = { version = "0.7", features = ["json", "ws"] }
tokio              = { version = "1",   features = ["full"] }
tower              = { version = "0.4", features = ["util", "limit"] }
tower-http         = { version = "0.5", features = ["cors", "trace", "limit"] }

# Serialization
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

# Database
sqlx               = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }

# Identifiers + time
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }

# Cryptography — zero external TLS deps, all in pure Rust
x25519-dalek       = { version = "2", features = ["static_secrets"] }
chacha20poly1305   = "0.10"
blake3             = "1"
hkdf               = "0.12"
sha2               = "0.10"
rand               = "0.8"
zeroize            = { version = "1", features = ["derive"] }
bs58               = "0.5"
base64             = "0.22"
subtle             = "2"       # constant-time comparisons

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow             = "1"

# Rate limiting / state
dashmap            = "5"

# HTTP client (for brain registry heartbeat + AethyrRank signals)
reqwest            = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1

[profile.dev]
opt-level = 1   # crypto is unusably slow at opt-level 0
