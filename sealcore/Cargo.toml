[package]
name = "sealcore"
version = "0.1.0"
edition = "2021"
description = "Gnosis sealed-mode crypto core (X25519 ECDH -> HKDF -> AES-256-GCM, Argon2id backup wrap). Compiled to WASM for the browser unsealer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
